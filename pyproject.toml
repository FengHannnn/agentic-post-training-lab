[project]
name = "agentic-post-training-lab"
version = "0.1.0"
description = "Agentic post-training experiments with SFT, DPO, GRPO, and rollout engines."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.14,<2.15",
]

[project.optional-dependencies]
tokenizer = ["transformers>=4.57,<5"]
train = ["transformers>=4.57,<5", "peft>=0.17,<0.18", "accelerate>=1.10,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_post_training"]
